name: Import SkidkoRadar v0.9

on:
  push:
    paths:
      - skidki_telegram_bot_v09_catalog_scan.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archive, run 67 tests, and unpack safely
        run: |
          python - <<'PY'
          import hashlib
          import shutil
          import stat
          import subprocess
          import sys
          import tempfile
          import zipfile
          from pathlib import Path

          archive = Path('skidki_telegram_bot_v09_catalog_scan.zip')
          if not archive.is_file():
              raise SystemExit('Upload the v0.9 ZIP to the repository root before running this workflow.')
          expected = 'dae07ba08f0d53b6e0a3dfe20208a151e8e680152b31a8b5e9d611ce7bb173a2'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('ZIP checksum mismatch: refusing to import unexpected contents.')

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              with zipfile.ZipFile(archive) as z:
                  members = [i for i in z.infolist() if not i.is_dir()]
                  if sum(i.file_size for i in members) > 5_000_000:
                      raise SystemExit('Archive too large')
                  for item in members:
                      parts = Path(item.filename).parts
                      if (not parts or Path(item.filename).is_absolute()
                          or any(p in ('..', '', '.git') for p in parts)
                          or '\\' in item.filename
                          or stat.S_ISLNK(item.external_attr >> 16)):
                          raise SystemExit('Unsafe ZIP entry: ' + item.filename)
                      target = root.joinpath(*parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(item))

              for required in ('bot.py', 'core.py', 'providers.py', 'tests/test_catalog_mcp_v09.py'):
                  if not (root / required).is_file():
                      raise SystemExit('Missing source: ' + required)

              subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-q'],
                             cwd=root, check=True)

              for item in members:
                  relative = Path(item.filename)
                  target = Path.cwd() / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(root / relative, target)

          archive.unlink()
          print('Verified and imported SkidkoRadar v0.9 source code.')
          PY
      - name: Commit verified sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import verified SkidkoRadar v0.9 sources"
            git push
          fi
