name: Direct import SkidkoRadar v0.9

on:
  push:
    paths:
      - '.github/import/part05.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify, test and import source archive
        run: |
          python - <<'PY'
          import base64, bz2, hashlib, io, os, shutil, subprocess, sys, tarfile, tempfile
          from pathlib import Path
          files = [Path(f'.github/import/part{i:02d}.b64') for i in range(6)]
          if not all(f.is_file() for f in files):
              raise SystemExit('Some archive parts are missing.')
          data = base64.b64decode(''.join(f.read_text() for f in files), validate=True)
          actual = hashlib.sha256(data).hexdigest()
          expected = '77c44978f346bf26909d6da45ffa069ee813d0828057ed6f6d4858df90711c01'
          if actual != expected:
              raise SystemExit(f'Archive hash mismatch: {actual}')
          if len(data) > 1_000_000:
              raise SystemExit('Archive unexpectedly large')
          blob = bz2.decompress(data)
          if len(blob) > 5_000_000:
              raise SystemExit('Uncompressed archive too large')
          with tempfile.TemporaryDirectory() as temporary:
              temp = Path(temporary)
              with tarfile.open(fileobj=io.BytesIO(blob), mode='r:') as tar:
                  members = tar.getmembers()
                  for item in members:
                      target = Path(item.name)
                      if (not item.isfile() or target.is_absolute() or
                          any(p in ('..', '.git', '.github/import') for p in target.parts) or
                          target.as_posix().startswith('.github/import/') or
                          str(target) in ('', '.')):
                          raise SystemExit('Unsafe archive member: '+item.name)
                      out = temp / target
                      out.parent.mkdir(parents=True, exist_ok=True)
                      with tar.extractfile(item) as inp, out.open('wb') as output:
                          shutil.copyfileobj(inp, output)
              for path in ['bot.py','core.py','providers.py','tests/test_catalog_mcp_v09.py']:
                  if not (temp / path).is_file():
                      raise SystemExit('Missing essential source: '+path)
              subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-q'], cwd=temp, check=True)
              for f in temp.rglob('*'):
                  if f.is_file():
                      relative = f.relative_to(temp)
                      if relative.as_posix() == 'README.md':
                          continue
                      dest = Path.cwd() / relative
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(f, dest)
          for f in files: f.unlink()
          Path('.github/import').rmdir()
          print('Verified and installed SkidkoRadar v0.9 source files.')
          PY
      - name: Commit imported files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified SkidkoRadar v0.9 source files'
            git push
          fi
